services: 
  # PostgreSQL for catalog storaging
  postgres:
    image          : postgres:15-alpine
    container_name : postgres
    hostname       : postgres
    environment:
      POSTGRES_DB       : ${POSTGRES_DB}
      POSTGRES_USER     : ${POSTGRES_USER}
      POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}
      PGDATA            : ${PGDATA}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data      
    ports:
      - "5432:5432"
    networks:
      iceberg_net:
    restart: unless-stopped


  # Minio service
  minio:
    image          : minio/minio
    container_name : minio
    hostname       : minio
    environment:
      MINIO_ROOT_USER     : ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD : ${MINIO_ROOT_PASSWORD}
      MINIO_DOMAIN        : ${MINIO_DOMAIN}
      MINIO_REGION        : ${AWS_REGION}
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - 9001:9001  # MinIO Console (optional)
      - 9000:9000
    volumes:
      - ./warehouse:/data
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
  

  # Minio client service
  minio_client:
    depends_on:
      - minio
    image         : minio/mc
    container_name: minio_client
    networks:
      iceberg_net:
    environment:
      MINIO_ROOT_USER       : ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD   : ${MINIO_ROOT_PASSWORD}
      AWS_ACCESS_KEY_ID     : ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY : ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION            : ${AWS_REGION}
    entrypoint: |
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb minio/warehouse --ignore-existing;
      /usr/bin/mc policy set public minio/warehouse;
      tail -f /dev/null
      "

  # Rest service
  rest:
    image          : tabulario/iceberg-rest:latest
    container_name : iceberg-rest
    hostname       : iceberg-rest
    networks:
      iceberg_net:
    ports:
      - 8181:8181  
    environment:      
      # Catalog Configuration
      CATALOG_WAREHOUSE            : ${CATALOG_WAREHOUSE}
      CATALOG_URI                  : jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      CATALOG_JDBC_USER            : ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD        : ${POSTGRES_PASSWORD}
      CATALOG_IO__IMPL             : ${CATALOG_IO__IMPL}

      # S3 Configuration for MinIO
      CATALOG_S3_ENDPOINT          : ${CATALOG_S3_ENDPOINT}
      CATALOG_S3_PATH_STYLE_ACCESS : "true"
      
      # AWS/S3 Configuration for MinIO
      AWS_ACCESS_KEY_ID            : ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY        : ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION                   : ${AWS_REGION}
      
      # REST Configuration
      REST_PORT                    : 8181
      REST_BIND_HOST               : 0.0.0.0
    depends_on:
      - postgres
      - minio
    restart: unless-stopped

  # Spark Master with Jupyter Toree in the same container
  spark-iceberg:
    build:
      context: .
      dockerfile  : Dockerfile.jupyter
    container_name: spark-iceberg-master
    networks:
      iceberg_net:
    depends_on:
      - rest
      - minio
    volumes:
      - ./notebooks:/home/iceberg/notebooks
      - ./spark-conf:/opt/spark/conf
      - ../:/home/code
    environment:
      # Spark Master Configuration
      SPARK_MODE                   : master
      SPARK_MASTER_HOST            : spark-iceberg
      SPARK_MASTER_PORT            : ${SPARK_MASTER_PORT}
      SPARK_MASTER_WEBUI_PORT      : ${SPARK_MASTER_WEBUI_PORT}
      SPARK_DRIVER_MEMORY          : 6g
      
      # AWS/S3 Configuration for MinIO
      AWS_ACCESS_KEY_ID            : ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY        : ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION                   : ${AWS_REGION}
      AWS_S3_ENDPOINT              : ${CATALOG_S3_ENDPOINT}    

      # Jupyter Configuration
      JUPYTER_ENABLE_LAB     : yes
      JUPYTER_TOKEN          : ${JUPYTER_TOKEN}
      
    ports:
      - 4040:4040  # Spark UI
      - 7077:7077  # Spark Master
      - 8083:8083  # Spark Master Web UI
      - 8888:8888  # Jupyter Notebook

  
  # Spark and Iceberg services (WORKER 1)
  spark-worker-1:
    image         : tabulario/spark-iceberg
    container_name: spark-iceberg-worker-1
    networks:
      iceberg_net:
    depends_on:
      - spark-iceberg
    volumes:
      - ./spark-conf:/opt/spark/conf
    environment:
      SPARK_MODE              : worker
      SPARK_WORKER_HOST       : spark-worker-1
      SPARK_WORKER_PORT       : ${SPARK_WORKER_PORT_1}
      SPARK_WORKER_WEBUI_PORT : ${SPARK_WORKER_WEBUI_PORT_1}
      SPARK_MASTER_URL        : spark://spark-iceberg:${SPARK_MASTER_PORT}
      SPARK_WORKER_CORES      : ${SPARK_WORKER_CORES_1}
      SPARK_WORKER_MEMORY     : ${SPARK_WORKER_MEMORY_1}

      # AWS/S3 Configuration for MinIO
      AWS_ACCESS_KEY_ID       : ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY   : ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION              : ${AWS_REGION}
      AWS_S3_ENDPOINT         : ${CATALOG_S3_ENDPOINT}


  # Spark and Iceberg services (WORKER 2)
  spark-worker-2:
    image         : tabulario/spark-iceberg
    container_name: spark-iceberg-worker-2
    networks:
      iceberg_net:
    depends_on:
      - spark-iceberg
    volumes:
      - ./spark-conf:/opt/spark/conf
    environment:
      SPARK_MODE              : worker
      SPARK_WORKER_HOST       : spark-worker-2
      SPARK_WORKER_PORT       : ${SPARK_WORKER_PORT_2}
      SPARK_WORKER_WEBUI_PORT : ${SPARK_WORKER_WEBUI_PORT_2}
      SPARK_MASTER_URL        : spark://spark-iceberg:${SPARK_MASTER_PORT}
      SPARK_WORKER_CORES      : ${SPARK_WORKER_CORES_2}
      SPARK_WORKER_MEMORY     : ${SPARK_WORKER_MEMORY_2}

      # AWS/S3 Configuration for MinIO
      AWS_ACCESS_KEY_ID       : ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY   : ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION              : ${AWS_REGION}
      AWS_S3_ENDPOINT         : ${CATALOG_S3_ENDPOINT}

# Networks
networks:
  iceberg_net:

# Volumes
volumes:
  spark-conf:
  notebooks:
  postgres-data: