services:
  # Spark and Iceberg services (MASTER)
  spark-iceberg:
    image         : tabulario/spark-iceberg
    container_name: spark-iceberg-master
    networks:
      iceberg_net:
    depends_on:
      - rest
      - minio
    volumes:
      - ./warehouse:/home/iceberg/warehouse
      - ./spark-conf:/opt/spark/conf
      - ./spark-home:/opt/spark
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-iceberg
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8083
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=20_mmatching_25
      - AWS_REGION=us-east-1
    ports:
      - 4040:4040  # Spark UI
      - 7077:7077  # Spark Master
      - 8083:8083  # Spark Master Web UI


  # Spark and Iceberg services (WORKER 1)
  spark-worker-1:
    image         : tabulario/spark-iceberg
    container_name: spark-iceberg-worker-1
    networks:
      iceberg_net:
    depends_on:
      - spark-iceberg
    volumes:
      - ./spark-conf:/opt/spark/conf
      - ./warehouse:/home/iceberg/warehouse
      - ./spark-home:/opt/spark
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_HOST=spark-worker-1
      - SPARK_WORKER_PORT=7078
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_MASTER_URL=spark://spark-iceberg:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=16G
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=20_mmatching_25
      - AWS_REGION=us-east-1


  # Spark and Iceberg services (WORKER 2)
  spark-worker-2:
    image         : tabulario/spark-iceberg
    container_name: spark-iceberg-worker-2
    networks:
      iceberg_net:
    depends_on:
      - spark-iceberg
    volumes:
      - ./spark-conf:/opt/spark/conf
      - ./warehouse:/home/iceberg/warehouse
      - ./spark-home:/opt/spark
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_HOST=spark-worker-2
      - SPARK_WORKER_PORT=7079
      - SPARK_WORKER_WEBUI_PORT=8082
      - SPARK_MASTER_URL=spark://spark-iceberg:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=16G
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=20_mmatching_25
      - AWS_REGION=us-east-1


  # Livy service
  # livy:
  #   build:
  #     context: .
  #     dockerfile  : Dockerfile
  #   container_name: livy-server
  #   environment:
  #     - SPARK_MASTER_ENDPOINT=spark://spark-iceberg:7077
  #     - LIVY_SPARK_MASTER=spark://spark-iceberg:7077
  #     - LIVY_SPARK_DEPLOY_MODE=client
  #     - AWS_ACCESS_KEY_ID=admin
  #     - AWS_SECRET_ACCESS_KEY=20_mmatching_25
  #     - AWS_REGION=us-east-1
  #   ports:
  #     - "8998:8998"  # Livy REST API port
  #   volumes:
  #     - ./livy-conf:/opt/livy/conf
  #     - ./livy-logs:/opt/livy/logs
  #     - ./spark-conf:/opt/spark/conf
  #     - ./warehouse:/home/iceberg/warehouse
  #   depends_on:
  #     - spark-iceberg
  #     - spark-worker-1
  #     - spark-worker-2
  #     - minio
  #   networks:
  #     iceberg_net:
  

  # Zeppelin service
  zeppelin:
    image          : apache/zeppelin:0.10.1
    container_name : zeppelin
    networks:
      iceberg_net:
    depends_on:
      - spark-iceberg
    environment:
      - SPARK_MASTER=spark://spark-iceberg:7077
      - SPARK_HOME=/opt/spark
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=20_mmatching_25
      - AWS_REGION=us-east-1
      - ZEPPELIN_NOTEBOOK_DIR=/opt/zeppelin/notebook
      - ZEPPELIN_NOTEBOOK_PUBLIC=true
      - ZEPPELIN_ANONYMOUS_ALLOWED=true
    ports:
      - 8080:8080
    volumes:
      - zeppelin-notebooks:/opt/zeppelin/notebook
      - ./warehouse:/opt/warehouse
      - ./spark-home:/opt/spark
  
  # Rest service
  rest:
    image         : apache/iceberg-rest-fixture
    container_name: iceberg-rest
    networks:
      iceberg_net:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=20_mmatching_25
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
  

  # Minio service
  minio:
    image         : minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=20_mmatching_25
      - MINIO_DOMAIN=minio
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - 9001:9001  # MinIO Console (optional)
      - 9000:9000
    command: ["server", "/data", "--console-address", ":9001"]
  

  # Minio client service
  mc:
    depends_on:
      - minio
    image         : minio/mc
    container_name: mc
    networks:
      iceberg_net:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=20_mmatching_25
      - AWS_REGION=us-east-1
    entrypoint: |
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin 20_mmatching_25) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc rm -r --force minio/warehouse;
      /usr/bin/mc mb minio/warehouse;
      /usr/bin/mc anonymous set public minio/warehouse;
      tail -f /dev/null
      "

# Networks
networks:
  iceberg_net:

# Volumes
volumes:
  livy-logs:
  livy-conf:
  spark-conf:
  spark-home:
  warehouse:
  zeppelin-notebooks:
  zeppelin-notebook-storage: