services:
  # Spark Master with Jupyter Toree in the same container
  spark-iceberg:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: spark-iceberg-master
    networks:
      iceberg_net:
    depends_on:
      - rest
      - minio
    volumes:
      - ./notebooks:/home/iceberg/notebooks
      - ./warehouse:/home/iceberg/warehouse
      - ./spark-conf:/opt/spark/conf
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-iceberg
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8083
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=20_mmatching_25
      - AWS_REGION=us-east-1
      - JUPYTER_ENABLE_LAB=yes
    ports:
      - 4040:4040  # Spark UI
      - 7077:7077  # Spark Master
      - 8083:8083  # Spark Master Web UI
      - 8888:8888  # Jupyter Notebook

  # Spark and Iceberg services (WORKER 1)
  spark-worker-1:
    image         : tabulario/spark-iceberg
    container_name: spark-iceberg-worker-1
    networks:
      iceberg_net:
    depends_on:
      - spark-iceberg
    volumes:
      - ./spark-conf:/opt/spark/conf
      - ./warehouse:/home/iceberg/warehouse
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_HOST=spark-worker-1
      - SPARK_WORKER_PORT=7078
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_MASTER_URL=spark://spark-iceberg:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=16G
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=20_mmatching_25
      - AWS_REGION=us-east-1


  # Spark and Iceberg services (WORKER 2)
  spark-worker-2:
    image         : tabulario/spark-iceberg
    container_name: spark-iceberg-worker-2
    networks:
      iceberg_net:
    depends_on:
      - spark-iceberg
    volumes:
      - ./spark-conf:/opt/spark/conf
      - ./warehouse:/home/iceberg/warehouse
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_HOST=spark-worker-2
      - SPARK_WORKER_PORT=7079
      - SPARK_WORKER_WEBUI_PORT=8082
      - SPARK_MASTER_URL=spark://spark-iceberg:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=16G
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=20_mmatching_25
      - AWS_REGION=us-east-1

  # Rest service
  rest:
    image         : apache/iceberg-rest-fixture
    container_name: iceberg-rest
    networks:
      iceberg_net:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=20_mmatching_25
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
  

  # Minio service
  minio:
    image         : minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=20_mmatching_25
      - MINIO_DOMAIN=minio
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - 9001:9001  # MinIO Console (optional)
      - 9000:9000
    command: ["server", "/data", "--console-address", ":9001"]
  

  # Minio client service
  mc:
    depends_on:
      - minio
    image         : minio/mc
    container_name: mc
    networks:
      iceberg_net:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=20_mmatching_25
      - AWS_REGION=us-east-1
    entrypoint: |
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin 20_mmatching_25) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc rm -r --force minio/warehouse;
      /usr/bin/mc mb minio/warehouse;
      /usr/bin/mc anonymous set public minio/warehouse;
      tail -f /dev/null
      "

# Networks
networks:
  iceberg_net:

# Volumes
volumes:
  livy-logs:
  livy-conf:
  spark-conf:
  warehouse:
  zeppelin-notebooks:
  zeppelin-notebook-storage:
  notebooks: